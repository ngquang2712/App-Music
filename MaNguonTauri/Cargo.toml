[package]
name = "omni-music-player"
version = "2.0.0"
description = "Trinh phat nhac NgQuang Music App"
authors = ["OmniMusic"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "multipart"] }
url = "2.5"
regex = "1.10"
discord-rich-presence = "0.2"
base64 = "0.22"
ring = "0.17.14"
